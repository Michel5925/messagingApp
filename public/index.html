<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Messaging App</title>
</head>
<body>
    <div id="authSection">
        <!-- Login -->
         <div id="loginScreen">
            <h1>Welcome Back!!!</h1>
            <p>Log in to your account</p>
            <p>Connect and chat with others.</p>

            <form id="login">
                <label for="loginUsername">Username</label>
                <input type="text" id="loginUsername" required>
        
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" required>
        
                <button type="submit">Login</button>
            </form>

            <p>Don't have an account? <button id="showRegister">Register now!</button></p>
         </div>

         <!-- Registration -->
         <div id="registerScreen">
            <h1>Create an Account</h1>
            <p>Register to start messaging</p>

            <form id="registration">
                <h2>Create Account</h2>
    
                <label for="name">Username</label>
                <input type="text" id="name" required>
        
                <label for="password">Password</label>
                <input type="password" id="password" required>
        
                <button type="submit">Create User</button>
            </form>

            <p>Already have an account? <button id="showLogin">Log in!</button></p>
         </div>

        <!-- <form id="membershipForm">
            <h2>Become a Member</h2>

            <input type="password" id="membershipSecret" placeholder="Membership secret" required>

            <button type="submit">Join</button>
        </form> -->
    </div>

    <div id="app">
        <aside id="userList">
            <h2>Users</h2>

            <div id="users"></div>

            <!-- <button id="joinMembership">Become a Member</button> -->
            <button id="adminButton">Admin Dashboard</button>
            <button id="logout">Logout</button>
        </aside>

        <main id="chat">
            <header id="chatHeader">
                <button id="backToUsers">←</button>
                <h2 id="chatWith">Select a user</h2>
            </header>

            <div id="messages"></div>

            <form id="messageForm">
                <input type="text" id="messageText" placeholder="Type a message..." required>
        
                <button type="submit">Send Message</button>
            </form>
        </main>
    </div>

    <section id="adminPanel">
        <h1>Admin Dashboard</h1>

        <button id="backToChat">Back to Chat</button>

        <div id="adminUsers">
            <table id="adminUserTable">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Member</th>
                        <th>Admin</th>
                        <th>Joined</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="adminUserTableBody"></tbody>
            </table>
        </div>
    </section>
    
    <script src="script.js"></script>
</body>
</html>
